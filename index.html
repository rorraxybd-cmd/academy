<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rorraxy - Code Preview</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --panel-bg: rgba(18, 18, 23, 0.95);
      --card-bg: #1a1a22;
      --border-color: #262633;
      --accent-gold: #d4af37;
      --accent-gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
      --text-main: #f0f0f5;
      --text-muted: #8a8a9e;
      --danger-color: #e63946;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #000;
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* 100% Fullscreen Preview Area */
    .preview-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      overflow: hidden;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: #ffffff;
    }

    .iframe-wrapper.mobile-view {
      width: 375px;
      height: 667px;
      border-radius: 20px;
      border: 8px solid #222;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* Floating Toggle Button (Always Available) */
    .floating-toggle-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 999;
      background: var(--accent-gold-gradient);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .floating-toggle-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
    }

    /* Overlay Backdrop */
    .popup-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .popup-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Floating Pop-up Code Panel Folder */
    .popup-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 420px;
      max-width: 92vw;
      max-height: 90vh;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      z-index: 1001;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow-y: auto;
    }

    .popup-backdrop.active .popup-panel {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 800;
      background: var(--accent-gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover { color: #fff; }

    .section-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-gold);
      text-transform: uppercase;
    }

    .file-input-wrapper input[type="file"] { display: none; }

    .file-label {
      display: block;
      background: #111116;
      border: 1px dashed var(--border-color);
      padding: 6px;
      text-align: center;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
    }
    .file-label:hover { border-color: var(--accent-gold); color: var(--text-main); }

    textarea {
      width: 100%;
      height: 130px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #7ef2a9;
      font-family: 'Consolas', monospace;
      font-size: 0.8rem;
      padding: 8px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent-gold); }
    #jsCode { color: #64dfdf; }

    /* Controls inside Pop-up */
    .btn-generate {
      background: var(--accent-gold-gradient);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-generate:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .sub-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .view-switcher {
      display: flex;
      background: #111116;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px;
      flex: 1;
    }

    .view-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .view-btn.active {
      background: #22222d;
      color: var(--accent-gold);
    }

    .btn-clear {
      background: rgba(230, 57, 70, 0.1);
      border: 1px solid rgba(230, 57, 70, 0.3);
      color: #ff6b6b;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .btn-clear:hover {
      background: var(--danger-color);
      color: #fff;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 2px; }
  </style>
</head>
<body>

  <!-- Floating Toggle Button on Canvas -->
  <button class="floating-toggle-btn" onclick="togglePopup(true)">
    ⚙️ Code Editor
  </button>

  <!-- Full Screen Preview Area -->
  <div class="preview-container">
    <div class="iframe-wrapper" id="iframeWrapper">
      <iframe id="previewFrame"></iframe>
    </div>
  </div>

  <!-- Pop-up Overlay Backdrop -->
  <div class="popup-backdrop" id="popupBackdrop">
    
    <!-- Pop-up Control Panel Folder -->
    <div class="popup-panel">
      
      <div class="panel-header">
        <div class="panel-title">Code Editor Panel</div>
        <button class="close-btn" onclick="togglePopup(false)">✕</button>
      </div>

      <!-- 1. CSS Box -->
      <div class="section-box">
        <div class="section-title">CSS STYLESHEET</div>
        <div class="file-input-wrapper">
          <label class="file-label" for="cssFileInput" id="cssFileLabel">Upload .css File</label>
          <input type="file" id="cssFileInput" accept=".css" onchange="handleFileUpload(event, 'cssCode', 'cssFileLabel')">
        </div>
        <textarea id="cssCode" placeholder="Paste CSS code here..."></textarea>
      </div>

      <!-- 2. JS Box -->
      <div class="section-box">
        <div class="section-title">JAVASCRIPT CODE</div>
        <div class="file-input-wrapper">
          <label class="file-label" for="jsFileInput" id="jsFileLabel">Upload .js File</label>
          <input type="file" id="jsFileInput" accept=".js" onchange="handleFileUpload(event, 'jsCode', 'jsFileLabel')">
        </div>
        <textarea id="jsCode" placeholder="Paste JS code here..."></textarea>
      </div>

      <!-- Generate Button -->
      <button class="btn-generate" onclick="generatePage()">GENERATE</button>

      <!-- View Controls & Clear All -->
      <div class="sub-controls">
        <div class="view-switcher">
          <button class="view-btn active" id="desktopViewBtn" onclick="switchView('desktop')">💻 Desktop</button>
          <button class="view-btn" id="mobileViewBtn" onclick="switchView('mobile')">📱 Mobile</button>
        </div>
        <button class="btn-clear" onclick="clearAll()">Clear All</button>
      </div>

    </div>

  </div>

  <script>
    // Pop-up Toggle Logic
    function togglePopup(show) {
      const backdrop = document.getElementById('popupBackdrop');
      if (show) {
        backdrop.classList.add('active');
      } else {
        backdrop.classList.remove('active');
      }
    }

    // Close popup when clicking backdrop outside panel
    document.getElementById('popupBackdrop').addEventListener('click', function(e) {
      if (e.target === this) {
        togglePopup(false);
      }
    });

    // Generate HTML Page and Render Frame
    function generatePage() {
      const css = document.getElementById('cssCode').value;
      const js = document.getElementById('jsCode').value;

      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

      const fullSource = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
            ${css}
          </style>
        </head>
        <body>
          <div id="statusAlert" style="display:none;"></div>
          <div id="app"></div>
          <div id="root"></div>

          <script>
            try {
              ${js}
            } catch (err) {
              console.error(err);
            }
          <\/script>
        </body>
        </html>
      `;

      iframeDoc.open();
      iframeDoc.write(fullSource);
      iframeDoc.close();

      // Automatically hide popup after generating for clean view
      togglePopup(false);
    }

    // Device View Switcher
    function switchView(mode) {
      const wrapper = document.getElementById('iframeWrapper');
      const desktopBtn = document.getElementById('desktopViewBtn');
      const mobileBtn = document.getElementById('mobileViewBtn');

      if (mode === 'mobile') {
        wrapper.classList.add('mobile-view');
        mobileBtn.classList.add('active');
        desktopBtn.classList.remove('active');
      } else {
        wrapper.classList.remove('mobile-view');
        desktopBtn.classList.add('active');
        mobileBtn.classList.remove('active');
      }
    }

    // File Upload Reader
    function handleFileUpload(event, targetTextareaId, labelId) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById(labelId).innerText = "File: " + file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(targetTextareaId).value = e.target.result;
      };
      reader.readAsText(file);
    }

    // Clear All Functionality
    function clearAll() {
      document.getElementById('cssCode').value = '';
      document.getElementById('jsCode').value = '';
      document.getElementById('cssFileLabel').innerText = "Upload .css File";
      document.getElementById('jsFileLabel').innerText = "Upload .js File";
      document.getElementById('cssFileInput').value = '';
      document.getElementById('jsFileInput').value = '';
      
      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write('');
      iframeDoc.close();
    }
  </script>
</body>
</html>
