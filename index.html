<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS & JS Live Preview Tester</title>
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --panel-bg: #141419;
      --border-color: #2a2a35;
      --accent-gold: #d4af37;
      --accent-gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
      --text-main: #f0f0f5;
      --text-muted: #8a8a9e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Control Bar */
    .header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--accent-gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: #1f1f28;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: var(--accent-gold);
      color: #fff;
    }

    .btn-gold {
      background: var(--accent-gold-gradient);
      color: #000;
      border: none;
      font-weight: 700;
    }

    .btn-gold:hover {
      opacity: 0.9;
      color: #000;
    }

    /* Main Grid Layout */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    /* Left Panel: Inputs */
    .input-panel {
      width: 380px;
      min-width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 15px;
      overflow-y: auto;
    }

    .section-box {
      background: #0f0f13;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* File Upload Input */
    .file-input-wrapper {
      position: relative;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-label {
      display: block;
      background: #1a1a24;
      border: 1px dashed var(--border-color);
      padding: 8px;
      text-align: center;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-label:hover {
      border-color: var(--accent-gold);
      color: var(--text-main);
    }

    /* Textareas for raw coding */
    textarea {
      width: 100%;
      height: 140px;
      background: #08080a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #7ef2a9;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.85rem;
      padding: 10px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent-gold);
    }

    /* HTML Layout structure wrapper optional */
    .html-box textarea {
      color: #fca311;
      height: 90px;
    }

    /* Right Panel: Preview Area */
    .preview-panel {
      flex: 1;
      background: #ffffff;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2a35;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-gold);
    }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <div class="header">
    <div class="brand-title">Code Preview Tester</div>
    <div class="controls">
      <button class="btn" onclick="clearAll()">Clear All</button>
      <button class="btn btn-gold" onclick="updatePreview()">Render Preview</button>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    
    <!-- Left Input Sidebar -->
    <div class="input-panel">
      
      <!-- Optional Base HTML -->
      <div class="section-box html-box">
        <div class="section-title">
          <span>HTML Body Elements</span>
        </div>
        <textarea id="htmlCode" placeholder="<div class='box'>Hello World</div>" oninput="updatePreview()"></textarea>
      </div>

      <!-- CSS Section -->
      <div class="section-box">
        <div class="section-title">
          <span>CSS Stylesheet</span>
        </div>
        <div class="file-input-wrapper">
          <label class="file-label" for="cssFileInput" id="cssFileLabel">Upload .css File</label>
          <input type="file" id="cssFileInput" accept=".css" onchange="handleFileUpload(event, 'cssCode', 'cssFileLabel')">
        </div>
        <textarea id="cssCode" placeholder="Paste CSS code here..." oninput="updatePreview()"></textarea>
      </div>

      <!-- JS Section -->
      <div class="section-box">
        <div class="section-title">
          <span>JavaScript Code</span>
        </div>
        <div class="file-input-wrapper">
          <label class="file-label" for="jsFileInput" id="jsFileLabel">Upload .js File</label>
          <input type="file" id="jsFileInput" accept=".js" onchange="handleFileUpload(event, 'jsCode', 'jsFileLabel')">
        </div>
        <textarea id="jsCode" placeholder="Paste JS code here..." oninput="updatePreview()"></textarea>
      </div>

    </div>

    <!-- Right Live Preview Screen -->
    <div class="preview-panel">
      <iframe id="previewFrame"></iframe>
    </div>

  </div>

  <script>
    // Live Render function
    function updatePreview() {
      const html = document.getElementById('htmlCode').value;
      const css = document.getElementById('cssCode').value;
      const js = document.getElementById('jsCode').value;

      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

      const fullSource = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <style>
            ${css}
          </style>
        </head>
        <body>
          ${html || '<div id="app"></div>'}
          <script>
            try {
              ${js}
            } catch (err) {
              console.error(err);
            }
          <\/script>
        </body>
        </html>
      `;

      iframeDoc.open();
      iframeDoc.write(fullSource);
      iframeDoc.close();
    }

    // Handle File Upload (.css / .js)
    function handleFileUpload(event, targetTextareaId, labelId) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById(labelId).innerText = "File: " + file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(targetTextareaId).value = e.target.result;
        updatePreview();
      };
      reader.readAsText(file);
    }

    // Clear function
    function clearAll() {
      document.getElementById('htmlCode').value = '';
      document.getElementById('cssCode').value = '';
      document.getElementById('jsCode').value = '';
      document.getElementById('cssFileLabel').innerText = "Upload .css File";
      document.getElementById('jsFileLabel').innerText = "Upload .js File";
      document.getElementById('cssFileInput').value = '';
      document.getElementById('jsFileInput').value = '';
      updatePreview();
    }

    // Initial render call
    updatePreview();
  </script>
</body>
</html>
