<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Preview</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --panel-bg: #121217;
      --card-bg: #1a1a22;
      --border-color: #262633;
      --accent-gold: #d4af37;
      --accent-gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
      --text-main: #f0f0f5;
      --text-muted: #8a8a9e;
      --danger-color: #e63946;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Header */
    .header {
      background: rgba(18, 18, 23, 0.95);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      background: var(--accent-gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .controls { display: flex; gap: 12px; }

    .btn {
      background: #1f1f2a;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover { border-color: var(--accent-gold); color: #fff; }
    .btn-clear { background: rgba(230, 57, 70, 0.1); border-color: rgba(230, 57, 70, 0.3); color: #ff6b6b; }
    .btn-clear:hover { background: var(--danger-color); color: #fff; }

    /* Submit Button Styling */
    .btn-submit {
      background: var(--accent-gold-gradient);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
      transition: all 0.2s ease;
      margin-top: 5px;
      width: 100%;
    }

    .btn-submit:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }

    /* Main Workspace Layout */
    .main-container { display: flex; flex: 1; height: calc(100vh - 61px); }

    .input-panel {
      width: 380px;
      min-width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      overflow-y: auto;
    }

    .section-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .file-input-wrapper input[type="file"] { display: none; }

    .file-label {
      display: block;
      background: #111116;
      border: 1px dashed var(--border-color);
      padding: 8px;
      text-align: center;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .file-label:hover { border-color: var(--accent-gold); color: var(--text-main); }

    textarea {
      width: 100%;
      height: 180px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #7ef2a9;
      font-family: 'Consolas', monospace;
      font-size: 0.85rem;
      padding: 10px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent-gold); }
    #jsCode { color: #64dfdf; }

    /* Output Canvas Panel */
    .preview-panel { flex: 1; display: flex; flex-direction: column; height: 100%; background: #000; }
    iframe { width: 100%; flex: 1; border: none; background: #ffffff; }

    /* Console Panel */
    .console-box {
      height: 120px;
      background: #09090d;
      border-top: 2px solid var(--border-color);
      padding: 10px 15px;
      font-family: 'Consolas', monospace;
      font-size: 0.82rem;
      overflow-y: auto;
      color: #38bdf8;
    }
    .console-header { color: var(--accent-gold); font-weight: bold; margin-bottom: 6px; font-size: 0.75rem; display: flex; justify-content: space-between; }
    .console-log { margin-bottom: 4px; word-break: break-all; }
    .console-error { color: #ff6b6b; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand-title">Code Preview</div>
    <div class="controls">
      <button class="btn btn-clear" onclick="clearAll()">Clear All</button>
    </div>
  </div>

  <div class="main-container">
    
    <!-- Left Input Panel -->
    <div class="input-panel">
      
      <!-- 1. CSS Upload / Input Box -->
      <div class="section-box">
        <div class="section-title">CSS STYLESHEET</div>
        <div class="file-input-wrapper">
          <label class="file-label" for="cssFileInput" id="cssFileLabel">Upload .css File</label>
          <input type="file" id="cssFileInput" accept=".css" onchange="handleFileUpload(event, 'cssCode', 'cssFileLabel')">
        </div>
        <textarea id="cssCode" placeholder="Paste CSS code here..."></textarea>
      </div>

      <!-- 2. JS Upload / Input Box -->
      <div class="section-box">
        <div class="section-title">JAVASCRIPT CODE</div>
        <div class="file-input-wrapper">
          <label class="file-label" for="jsFileInput" id="jsFileLabel">Upload .js File</label>
          <input type="file" id="jsFileInput" accept=".js" onchange="handleFileUpload(event, 'jsCode', 'jsFileLabel')">
        </div>
        <textarea id="jsCode" placeholder="Paste JS code here..."></textarea>
      </div>

      <!-- Submit Button -->
      <button class="btn-submit" onclick="submitToHtmlPage()">Submit & Generate Page</button>

    </div>

    <!-- Right Live HTML Page Preview Output -->
    <div class="preview-panel">
      <iframe id="previewFrame"></iframe>
      
      <!-- Console View -->
      <div class="console-box" id="consoleOutput">
        <div class="console-header">
          <span>Console Output / JS Result</span>
          <span style="cursor:pointer; color:#8a8a9e;" onclick="clearConsole()">Clear Console</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Function that converts CSS + JS into a live complete HTML Page
    function submitToHtmlPage() {
      const css = document.getElementById('cssCode').value;
      const js = document.getElementById('jsCode').value;

      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

      clearConsole();

      // Generating complete HTML structure dynamically based on user CSS & JS
      const generatedHtmlDocument = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
            /* Base HTML layout defaults */
            body { 
              margin: 0; 
              padding: 20px; 
              font-family: system-ui, -apple-system, sans-serif;
            }
            .status-alert {
              padding: 15px 20px;
              border-radius: 8px;
              font-weight: 600;
              margin-bottom: 20px;
              display: none;
            }
            .status-alert.success {
              display: block !important;
              background: #003820;
              color: #00ff88;
              border: 1px solid #00ff88;
            }
            .status-alert.error {
              display: block !important;
              background: #38000a;
              color: #ff4d6d;
              border: 1px solid #ff4d6d;
            }
            
            /* User's CSS Stylesheet applied here */
            ${css}
          </style>
        </head>
        <body>
          
          <!-- Dynamic Target Containers for JS execution -->
          <div id="statusAlert" class="status-alert"></div>
          <div id="app"></div>
          <div id="root"></div>

          <script>
            // Console logger mapping to the main interface
            const customLog = function(...args) {
              window.parent.postMessage({ type: 'log', data: args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') }, '*');
            };
            const customError = function(...args) {
              window.parent.postMessage({ type: 'error', data: args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') }, '*');
            };
            console.log = customLog;
            console.error = customError;

            try {
              /* User's JS execution */
              ${js}

              // Auto execute function if present in uploaded JS (like showAlert)
              if (typeof showAlert === 'function') {
                showAlert('Page Generated: HTML Page is Live!', false);
              }
            } catch (err) {
              console.error(err.message);
            }
          <\/script>
        </body>
        </html>
      `;

      iframeDoc.open();
      iframeDoc.write(generatedHtmlDocument);
      iframeDoc.close();
    }

    // Capture console messages from preview iframe
    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.type) return;
      const consoleBox = document.getElementById('consoleOutput');
      const logDiv = document.createElement('div');
      
      if (e.data.type === 'log') {
        logDiv.className = 'console-log';
        logDiv.innerText = '> ' + e.data.data;
      } else if (e.data.type === 'error') {
        logDiv.className = 'console-log console-error';
        logDiv.innerText = 'Error: ' + e.data.data;
      }
      
      consoleBox.appendChild(logDiv);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    });

    function clearConsole() {
      const consoleBox = document.getElementById('consoleOutput');
      consoleBox.innerHTML = '<div class="console-header"><span>Console Output / JS Result</span><span style="cursor:pointer; color:#8a8a9e;" onclick="clearConsole()">Clear Console</span></div>';
    }

    // Handle uploaded files
    function handleFileUpload(event, targetTextareaId, labelId) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById(labelId).innerText = "File: " + file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(targetTextareaId).value = e.target.result;
      };
      reader.readAsText(file);
    }

    // Clear Button Logic
    function clearAll() {
      document.getElementById('cssCode').value = '';
      document.getElementById('jsCode').value = '';
      document.getElementById('cssFileLabel').innerText = "Upload .css File";
      document.getElementById('jsFileLabel').innerText = "Upload .js File";
      document.getElementById('cssFileInput').value = '';
      document.getElementById('jsFileInput').value = '';
      clearConsole();
      
      // Clear iframe preview screen
      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write('');
      iframeDoc.close();
    }
  </script>
</body>
</html>
