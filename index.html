<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Preview</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --panel-bg: #121217;
      --card-bg: #1a1a22;
      --border-color: #262633;
      --accent-gold: #d4af37;
      --accent-gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
      --text-main: #f0f0f5;
      --text-muted: #8a8a9e;
      --danger-color: #e63946;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Header */
    .header {
      background: rgba(18, 18, 23, 0.95);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      background: var(--accent-gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .controls { display: flex; gap: 12px; }

    .btn {
      background: #1f1f2a;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover { border-color: var(--accent-gold); color: #fff; }
    .btn-clear { background: rgba(230, 57, 70, 0.1); border-color: rgba(230, 57, 70, 0.3); color: #ff6b6b; }
    .btn-clear:hover { background: var(--danger-color); color: #fff; }
    .btn-gold { background: var(--accent-gold-gradient); color: #000; border: none; font-weight: 700; }

    /* Layout Workspace */
    .main-container { display: flex; flex: 1; height: calc(100vh - 61px); }

    .input-panel {
      width: 380px;
      min-width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      overflow-y: auto;
    }

    .section-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .file-input-wrapper input[type="file"] { display: none; }

    .file-label {
      display: block;
      background: #111116;
      border: 1px dashed var(--border-color);
      padding: 8px;
      text-align: center;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .file-label:hover { border-color: var(--accent-gold); color: var(--text-main); }

    textarea {
      width: 100%;
      height: 200px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #7ef2a9;
      font-family: 'Consolas', monospace;
      font-size: 0.85rem;
      padding: 10px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent-gold); }
    #jsCode { color: #64dfdf; }

    /* Right Side Output Canvas */
    .preview-panel { flex: 1; display: flex; flex-direction: column; height: 100%; background: #000; }
    iframe { width: 100%; flex: 1; border: none; background: #ffffff; }

    /* Console Box for Logs */
    .console-box {
      height: 120px;
      background: #09090d;
      border-top: 2px solid var(--border-color);
      padding: 10px 15px;
      font-family: 'Consolas', monospace;
      font-size: 0.82rem;
      overflow-y: auto;
      color: #38bdf8;
    }
    .console-header { color: var(--accent-gold); font-weight: bold; margin-bottom: 6px; font-size: 0.75rem; display: flex; justify-content: space-between; }
    .console-log { margin-bottom: 4px; word-break: break-all; }
    .console-error { color: #ff6b6b; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand-title">Code Preview</div>
    <div class="controls">
      <button class="btn btn-clear" onclick="clearAll()">Clear All</button>
      <button class="btn btn-gold" onclick="updatePreview()">Render Preview</button>
    </div>
  </div>

  <div class="main-container">
    
    <!-- Input Sidebar -->
    <div class="input-panel">
      <!-- 1. CSS Box -->
      <div class="section-box">
        <div class="section-title">CSS STYLESHEET</div>
        <div class="file-input-wrapper">
          <label class="file-label" for="cssFileInput" id="cssFileLabel">Upload .css File</label>
          <input type="file" id="cssFileInput" accept=".css" onchange="handleFileUpload(event, 'cssCode', 'cssFileLabel')">
        </div>
        <textarea id="cssCode" placeholder="Paste CSS code here..." oninput="updatePreview()"></textarea>
      </div>

      <!-- 2. JS Box -->
      <div class="section-box">
        <div class="section-title">JAVASCRIPT CODE</div>
        <div class="file-input-wrapper">
          <label class="file-label" for="jsFileInput" id="jsFileLabel">Upload .js File</label>
          <input type="file" id="jsFileInput" accept=".js" onchange="handleFileUpload(event, 'jsCode', 'jsFileLabel')">
        </div>
        <textarea id="jsCode" placeholder="Paste JS code here..." oninput="updatePreview()"></textarea>
      </div>
    </div>

    <!-- Right Live Render Panel -->
    <div class="preview-panel">
      <iframe id="previewFrame"></iframe>
      
      <div class="console-box" id="consoleOutput">
        <div class="console-header">
          <span>Console Output / JS Result</span>
          <span style="cursor:pointer; color:#8a8a9e;" onclick="clearConsole()">Clear Console</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    function updatePreview() {
      const css = document.getElementById('cssCode').value;
      const js = document.getElementById('jsCode').value;

      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

      clearConsole();

      // Pure HTML Page Execution Environment with NO extra layout elements
      const fullSource = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
            ${css}
          </style>
        </head>
        <body>
          <script>
            // Forward iframe logs to parent console window
            const customLog = function(...args) {
              window.parent.postMessage({ type: 'log', data: args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') }, '*');
            };
            const customError = function(...args) {
              window.parent.postMessage({ type: 'error', data: args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') }, '*');
            };
            console.log = customLog;
            console.error = customError;

            try {
              ${js}
            } catch (err) {
              console.error(err.message);
            }
          <\/script>
        </body>
        </html>
      `;

      iframeDoc.open();
      iframeDoc.write(fullSource);
      iframeDoc.close();
    }

    // Capture JS Console logs and errors
    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.type) return;
      const consoleBox = document.getElementById('consoleOutput');
      const logDiv = document.createElement('div');
      
      if (e.data.type === 'log') {
        logDiv.className = 'console-log';
        logDiv.innerText = '> ' + e.data.data;
      } else if (e.data.type === 'error') {
        logDiv.className = 'console-log console-error';
        logDiv.innerText = 'Error: ' + e.data.data;
      }
      
      consoleBox.appendChild(logDiv);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    });

    function clearConsole() {
      const consoleBox = document.getElementById('consoleOutput');
      consoleBox.innerHTML = '<div class="console-header"><span>Console Output / JS Result</span><span style="cursor:pointer; color:#8a8a9e;" onclick="clearConsole()">Clear Console</span></div>';
    }

    function handleFileUpload(event, targetTextareaId, labelId) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById(labelId).innerText = "File: " + file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(targetTextareaId).value = e.target.result;
        updatePreview();
      };
      reader.readAsText(file);
    }

    function clearAll() {
      document.getElementById('cssCode').value = '';
      document.getElementById('jsCode').value = '';
      document.getElementById('cssFileLabel').innerText = "Upload .css File";
      document.getElementById('jsFileLabel').innerText = "Upload .js File";
      document.getElementById('cssFileInput').value = '';
      document.getElementById('jsFileInput').value = '';
      clearConsole();
      updatePreview();
    }

    updatePreview();
  </script>
</body>
</html>
