<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Preview</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --panel-bg: #121217;
      --card-bg: #1a1a22;
      --border-color: #262633;
      --accent-gold: #d4af37;
      --accent-gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
      --text-main: #f0f0f5;
      --text-muted: #8a8a9e;
      --danger-color: #e63946;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Ultra-Slim Top Navigation Header */
    .header {
      background: rgba(18, 18, 23, 0.98);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      height: 42px;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 800;
      background: var(--accent-gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .controls { display: flex; gap: 8px; align-items: center; }

    /* View Switcher Controls */
    .view-switcher {
      display: flex;
      background: #111116;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px;
      margin-right: 10px;
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .view-btn.active {
      background: #22222d;
      color: var(--accent-gold);
    }

    .btn {
      background: #1f1f2a;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover { border-color: var(--accent-gold); color: #fff; }
    .btn-clear { background: rgba(230, 57, 70, 0.1); border-color: rgba(230, 57, 70, 0.3); color: #ff6b6b; }
    .btn-clear:hover { background: var(--danger-color); color: #fff; }

    /* Generate Button */
    .btn-generate {
      background: var(--accent-gold-gradient);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
      transition: all 0.2s ease;
      margin-top: 4px;
      width: 100%;
    }

    .btn-generate:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
    }

    /* Main Container Layout */
    .main-container { display: flex; flex: 1; height: calc(100vh - 42px); }

    .input-panel {
      width: 360px;
      min-width: 300px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      overflow-y: auto;
    }

    .section-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .file-input-wrapper input[type="file"] { display: none; }

    .file-label {
      display: block;
      background: #111116;
      border: 1px dashed var(--border-color);
      padding: 7px;
      text-align: center;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
    }
    .file-label:hover { border-color: var(--accent-gold); color: var(--text-main); }

    textarea {
      width: 100%;
      height: 200px;
      background: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #7ef2a9;
      font-family: 'Consolas', monospace;
      font-size: 0.82rem;
      padding: 8px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent-gold); }
    #jsCode { color: #64dfdf; }

    /* Maximized Full Height Preview Canvas */
    .preview-panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: #000000;
      overflow: hidden;
      position: relative;
    }

    /* Responsive Iframe Frame Container */
    .iframe-wrapper {
      width: 100%;
      height: 100%;
      transition: all 0.3s ease-in-out;
      background: #ffffff;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    .iframe-wrapper.mobile-view {
      width: 375px;
      height: 667px;
      border-radius: 20px;
      border: 8px solid #222;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <div class="header">
    <div class="brand-title">Code Preview</div>
    <div class="controls">
      <!-- Device View Switcher -->
      <div class="view-switcher">
        <button class="view-btn active" id="desktopViewBtn" onclick="switchView('desktop')">💻 Desktop</button>
        <button class="view-btn" id="mobileViewBtn" onclick="switchView('mobile')">📱 Mobile</button>
      </div>

      <button class="btn btn-clear" onclick="clearAll()">Clear All</button>
    </div>
  </div>

  <div class="main-container">
    
    <!-- Left Input Panel -->
    <div class="input-panel">
      
      <!-- 1. CSS Box -->
      <div class="section-box">
        <div class="section-title">CSS STYLESHEET</div>
        <div class="file-input-wrapper">
          <label class="file-label" for="cssFileInput" id="cssFileLabel">Upload .css File</label>
          <input type="file" id="cssFileInput" accept=".css" onchange="handleFileUpload(event, 'cssCode', 'cssFileLabel')">
        </div>
        <textarea id="cssCode" placeholder="Paste CSS code here..."></textarea>
      </div>

      <!-- 2. JS Box -->
      <div class="section-box">
        <div class="section-title">JAVASCRIPT CODE</div>
        <div class="file-input-wrapper">
          <label class="file-label" for="jsFileInput" id="jsFileLabel">Upload .js File</label>
          <input type="file" id="jsFileInput" accept=".js" onchange="handleFileUpload(event, 'jsCode', 'jsFileLabel')">
        </div>
        <textarea id="jsCode" placeholder="Paste JS code here..."></textarea>
      </div>

      <!-- Generate Button -->
      <button class="btn-generate" onclick="generatePage()">GENERATE</button>

    </div>

    <!-- Right Live Preview Screen (Full Screen Height) -->
    <div class="preview-panel">
      <div class="iframe-wrapper" id="iframeWrapper">
        <iframe id="previewFrame"></iframe>
      </div>
    </div>

  </div>

  <script>
    // Core function to build the live HTML page
    function generatePage() {
      const css = document.getElementById('cssCode').value;
      const js = document.getElementById('jsCode').value;

      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

      // Clean HTML Document execution
      const fullSource = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
            ${css}
          </style>
        </head>
        <body>
          <div id="statusAlert" style="display:none;"></div>
          <div id="app"></div>
          <div id="root"></div>

          <script>
            try {
              ${js}
            } catch (err) {
              console.error(err);
            }
          <\/script>
        </body>
        </html>
      `;

      iframeDoc.open();
      iframeDoc.write(fullSource);
      iframeDoc.close();
    }

    // Switch between Desktop and Mobile screen view
    function switchView(mode) {
      const wrapper = document.getElementById('iframeWrapper');
      const desktopBtn = document.getElementById('desktopViewBtn');
      const mobileBtn = document.getElementById('mobileViewBtn');

      if (mode === 'mobile') {
        wrapper.classList.add('mobile-view');
        mobileBtn.classList.add('active');
        desktopBtn.classList.remove('active');
      } else {
        wrapper.classList.remove('mobile-view');
        desktopBtn.classList.add('active');
        mobileBtn.classList.remove('active');
      }
    }

    // File Upload Handler
    function handleFileUpload(event, targetTextareaId, labelId) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById(labelId).innerText = "File: " + file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(targetTextareaId).value = e.target.result;
      };
      reader.readAsText(file);
    }

    // Clear All Functionality
    function clearAll() {
      document.getElementById('cssCode').value = '';
      document.getElementById('jsCode').value = '';
      document.getElementById('cssFileLabel').innerText = "Upload .css File";
      document.getElementById('jsFileLabel').innerText = "Upload .js File";
      document.getElementById('cssFileInput').value = '';
      document.getElementById('jsFileInput').value = '';
      
      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write('');
      iframeDoc.close();
    }
  </script>
</body>
</html>
